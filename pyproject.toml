[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "climatetest-manager"
version = "0.8.3"
description = "Desktop application for managing climate-resistance tests according to ABNT NBR IEC 60079-0:2020."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Jhon Cleiton" },
]
dependencies = [
  "flet[all]==0.86.4",
  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
  "platformdirs==4.11.0",
  "tzdata==2026.3",
  "Pillow==12.3.0",
  "pystray==0.19.5; sys_platform == 'win32'",
  "windows-toasts==1.3.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "pyinstaller==6.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["climatetest_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=climatetest_manager --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "src/climatetest_manager/round3_runtime.py",
  "src/climatetest_manager/round4_runtime.py",
  "src/climatetest_manager/round5_runtime.py",
  "src/climatetest_manager/round6_runtime.py",
  "src/climatetest_manager/round6_table17.py",
  "src/climatetest_manager/round7_runtime.py",
  "tests/unit/test_round6_runtime.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
