name: v0.8.0 complete regular version

on:
  push:
    branches:
      - "feat/v0.8.0-production-polish"

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.8.0-production-polish
      - name: Apply version
        shell: pwsh
        run: .\scripts\set_version.ps1 0.8.0 -SkipWorkflow
      - name: Commit regular files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/client.py src/climatetest_manager/__init__.py installer/ClimateTestManager.iss scripts/build_windows.ps1 scripts/install_server_tasks.ps1
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: completar versão v0.8.0 nos binários"
            git push origin HEAD:feat/v0.8.0-production-polish
          }
