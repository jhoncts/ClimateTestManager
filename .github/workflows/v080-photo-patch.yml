name: v0.8.0 temporary profile photo patch

on:
  push:
    branches:
      - feat/v0.8.0-production-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.8.0-production-polish
      - name: Apply patch
        run: python scripts/v080_profile_photo_patch.py
      - name: Format changed files
        run: |
          python -m pip install ruff==0.15.22
          ruff check --fix src/climatetest_manager/services/auth.py src/climatetest_manager/services/profile_photos.py
          ruff format src/climatetest_manager/services/auth.py src/climatetest_manager/services/profile_photos.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/climatetest_manager/services/auth.py src/climatetest_manager/services/profile_photos.py
          git commit -m "perf: otimizar foto de perfil antes de sincronizar"
          git push origin HEAD:feat/v0.8.0-production-polish
