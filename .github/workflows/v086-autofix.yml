name: v0.8.6 temporary autofix

on:
  push:
    branches:
      - feat/v0.8.6-stability-cold-flow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.8.6-stability-cold-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff==0.15.22
      - name: Format only v0.8.6 files
        shell: bash
        run: |
          files=(
            src/server.py
            src/climatetest_manager/domain/enums.py
            src/climatetest_manager/domain/cold_flow.py
            src/climatetest_manager/database/cold_models.py
            src/climatetest_manager/database/migrations.py
            src/climatetest_manager/database/session.py
            src/climatetest_manager/services/cold_workflows.py
            src/climatetest_manager/v086_navigation.py
            src/climatetest_manager/v086_runtime.py
            tests/unit/test_cold_flow.py
            tests/unit/test_cold_workflow_service.py
            tests/unit/test_database.py
          )
          ruff check "${files[@]}" --fix
          ruff format "${files[@]}"
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.py src/climatetest_manager/domain/enums.py src/climatetest_manager/domain/cold_flow.py src/climatetest_manager/database/cold_models.py src/climatetest_manager/database/migrations.py src/climatetest_manager/database/session.py src/climatetest_manager/services/cold_workflows.py src/climatetest_manager/v086_navigation.py src/climatetest_manager/v086_runtime.py tests/unit/test_cold_flow.py tests/unit/test_cold_workflow_service.py tests/unit/test_database.py
          git commit -m "chore: aplica formatacao automatica v0.8.6"
          git push origin HEAD:feat/v0.8.6-stability-cold-flow
