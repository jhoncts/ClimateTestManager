name: Apply round 2 real-world fixes v3

on:
  push:
    branches:
      - feat/v0.8.0-production-polish

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Apply reviewed second-round patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/round2-ui-fixes.yml').read_text(encoding='utf-8')
          section = workflow.split('      - name: Apply second-round fixes\n', 1)[1]
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = section.index(start_marker) + len(start_marker)
          end = section.index(end_marker, start)
          lines = section[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"
          exec(compile(script, '<round2-ui-fixes>', 'exec'), {'__name__': '__main__'})

          interaction = Path('src/climatetest_manager/ui/interaction.py')
          text = interaction.read_text(encoding='utf-8')
          text = text.replace('        async def wrapped(event):\n', '        async def wrapped(event=None):\n')
          text = text.replace('        def wrapped(event):\n', '        def wrapped(event=None):\n')
          interaction.write_text(text, encoding='utf-8')
          PY
      - name: Generate sharp UI logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          source = Path('src/assets/brand/climatetest-logo.png')
          target = Path('src/assets/brand/climatetest-logo-ui.png')
          with Image.open(source) as image:
              image = image.convert('RGBA')
              image = image.resize((256, 256), Image.Resampling.LANCZOS)
              image = image.filter(ImageFilter.UnsharpMask(radius=0.6, percent=125, threshold=2))
              image.save(target, format='PNG', optimize=True)
          PY
      - name: Format and autofix lint
        run: |
          python -m ruff format src tests
          python -m ruff check src tests --fix
          python -m ruff format src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m "fix: concluir ajustes de interface e notificações da v0.8.0"
          git push origin HEAD:feat/v0.8.0-production-polish
