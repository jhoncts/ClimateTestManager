          regex = r'    def test_removes_task_directly_without_powershell\(self\) -> None:.*?\n    def test_scheduled_action_uses_no_console_executable'
          replacement = '''    def test_disables_existing_task_without_deleting_it(self) -> None:\n        result = SimpleNamespace(returncode=0, stdout="", stderr="")\n        with (\n            patch("climatetest_manager.services.background.sys.platform", "win32"),\n            patch(\n                "climatetest_manager.services.background.subprocess.run",\n                return_value=result,\n            ) as run,\n        ):\n            configure_notification_task(enable=False)\n\n        commands = [call.args[0] for call in run.call_args_list]\n        self.assertTrue(any("/DISABLE" in command for command in commands))\n        self.assertFalse(any("/Delete" in command for command in commands))\n\n    def test_scheduled_action_uses_no_console_executable'''
          text, count = re.subn(regex, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('test_background.py: disable test replacement failed')
          write('tests/unit/test_background.py', text)

          write(
              'tests/unit/test_feedback_hotfix.py',
              '''"""Regressões encontradas durante o teste real da v0.8.0."""\n\nfrom datetime import datetime\n\nfrom climatetest_manager.services.auth import UserSummary\nfrom climatetest_manager.ui.formatters import format_datetime\nfrom climatetest_manager.ui.theme import THEME_OPTIONS\n\n\ndef _user(role: str) -> UserSummary:\n    return UserSummary(\n        id=1,\n        username="teste",\n        email="teste@example.com",\n        first_name="Teste",\n        last_name="Usuário",\n        role=role,\n        is_active=True,\n        onboarding_completed_at=None,\n        last_login_at=None,\n        profile_photo_b64=None,\n    )\n\n\ndef test_incident_utc_clock_is_presented_in_sao_paulo_time() -> None:\n    assert format_datetime(datetime(2026, 8, 12, 10, 38), assume_utc=True) == "12/08/2026 07:38"\n\n\ndef test_operator_operates_and_viewer_is_read_only() -> None:\n    operator = _user("operator")\n    viewer = _user("viewer")\n    assert operator.can_operate\n    assert not operator.is_viewer\n    assert viewer.is_viewer\n    assert not viewer.can_operate\n    assert viewer.role_label == "Consulta"\n\n\ndef test_theme_catalog_has_three_light_and_three_dark_options() -> None:\n    keys = [item[0] for item in THEME_OPTIONS]\n    assert keys == ["light", "amber", "ice", "dark", "graphite", "ocean"]\n'''
          )
          PY

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format
        run: python -m ruff format src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml src tests
          git diff --cached --quiet && exit 0
          git commit -m 'fix: corrigir problemas encontrados no teste real da v0.8.0'
          git push origin HEAD:feat/v0.8.0-production-polish
