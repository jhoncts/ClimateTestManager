name: Apply real-world feedback hotfix

on:
  push:
    branches:
      - feat/v0.8.0-production-polish

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, found {count}: {old[:90]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: regex expected one match, found {count}: {pattern[:90]!r}')
              write(path, result)

          # Explicit timezone data for packaged Windows builds.
          replace_once(
              'pyproject.toml',
              '  "platformdirs==4.11.0",\n',
              '  "platformdirs==4.11.0",\n  "tzdata==2026.3",\n',
          )

          write(
              'src/climatetest_manager/time_utils.py',
              '''"""Conversão explícita dos registros UTC para o horário operacional local."""\n\nfrom __future__ import annotations\n\nimport os\nfrom datetime import UTC, datetime\nfrom zoneinfo import ZoneInfo, ZoneInfoNotFoundError\n\nDEFAULT_TIMEZONE = "America/Sao_Paulo"\n\n\ndef local_timezone() -> ZoneInfo:\n    name = os.getenv("CLIMATETEST_TIMEZONE", DEFAULT_TIMEZONE).strip() or DEFAULT_TIMEZONE\n    try:\n        return ZoneInfo(name)\n    except ZoneInfoNotFoundError:\n        return ZoneInfo(DEFAULT_TIMEZONE)\n\n\ndef to_local_datetime(value: datetime, *, assume_utc: bool = False) -> datetime:\n    """Converte um instante para o fuso do laboratório sem alterar horários locais ingênuos."""\n\n    if value.tzinfo is None:\n        if not assume_utc:\n            return value\n        value = value.replace(tzinfo=UTC)\n    return value.astimezone(local_timezone()).replace(tzinfo=None)\n\n\ndef format_local_datetime(value: datetime | None, *, assume_utc: bool = False) -> str:\n    if value is None:\n        return "—"\n    return to_local_datetime(value, assume_utc=assume_utc).strftime("%d/%m/%Y %H:%M")\n'''
          )

          replace_once(
              'src/climatetest_manager/ui/formatters.py',
              'from climatetest_manager.domain.enums import ConditionInputMode\n',
              'from climatetest_manager.domain.enums import ConditionInputMode\nfrom climatetest_manager.time_utils import format_local_datetime\n',
          )
          replace_once(
              'src/climatetest_manager/ui/formatters.py',
              '''def format_datetime(value: datetime | None) -> str:\n    """Apresenta horário operacional no padrão brasileiro."""\n\n    return value.strftime("%d/%m/%Y %H:%M") if value else "—"\n''',
              '''def format_datetime(value: datetime | None, *, assume_utc: bool = False) -> str:\n    """Apresenta horário brasileiro; registros técnicos UTC podem ser convertidos explicitamente."""\n\n    return format_local_datetime(value, assume_utc=assume_utc)\n''',
          )

          replace_once(
              'src/climatetest_manager/services/notifications.py',
              'from climatetest_manager.services.branding import brand_logo_path\n',
              'from climatetest_manager.services.branding import brand_logo_path\nfrom climatetest_manager.time_utils import format_local_datetime\n',
          )
          replace_once(
              'src/climatetest_manager/services/notifications.py',
              '                f"Data do registro: {incident.reported_at:%d/%m/%Y %H:%M}",\n',
              '                f"Data do registro: {format_local_datetime(incident.reported_at, assume_utc=True)}",\n',
          )

          # Toggle only enables/disables the task created by the installer; it never recreates a Windows principal.
          write(
              'src/climatetest_manager/services/background.py',
              '''"""Controle seguro da tarefa de notificações criada pelo instalador Windows."""\n\nimport subprocess\nimport sys\nfrom pathlib import Path\nfrom xml.etree import ElementTree\n\nfrom climatetest_manager.config import get_data_directory, is_synced_directory\n\nTASK_NAME = "ClimateTestManager-Notifications"\n\n\ndef _project_root() -> Path:\n    return Path(__file__).resolve().parents[3]\n\n\ndef _notification_action(data_directory: str = "") -> str:\n    """Resolve o executável silencioso para diagnóstico e desenvolvimento."""\n\n    candidates: list[tuple[Path, Path | None]] = []\n    if getattr(sys, "frozen", False):\n        candidates.append((Path(sys.executable).resolve().with_name("ClimateTestNotifier.exe"), None))\n    project_root = _project_root()\n    candidates.extend(\n        [\n            (project_root / "dist" / "ClimateTestManager-v0.8.0" / "ClimateTestNotifier.exe", None),\n            (project_root / "dist" / "ClimateTestNotifier.exe", None),\n            (project_root / ".venv" / "Scripts" / "pythonw.exe", project_root / "src" / "notifier.py"),\n        ]\n    )\n    for executable, entrypoint in candidates:\n        if not executable.exists() or (entrypoint is not None and not entrypoint.exists()):\n            continue\n        parts = [f'"{executable}"']\n        if entrypoint is not None:\n            parts.append(f'"{entrypoint}"')\n        if data_directory:\n            parts.extend(["--data-directory", f'"{data_directory}"'])\n        return " ".join(parts)\n    raise RuntimeError("O notificador silencioso não foi encontrado. Repare a instalação do aplicativo.")\n\n\ndef _query_task_xml() -> bytes | str | None:\n    result = subprocess.run(\n        ["schtasks.exe", "/Query", "/TN", TASK_NAME, "/XML"],\n        capture_output=True,\n        check=False,\n        creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),\n    )\n    return result.stdout if result.returncode == 0 else None\n\n\ndef _task_exists() -> bool:\n    result = subprocess.run(\n        ["schtasks.exe", "/Query", "/TN", TASK_NAME],\n        capture_output=True,\n        text=True,\n        check=False,\n        creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),\n    )\n    return result.returncode == 0\n\n\ndef notification_task_installed() -> bool:\n    """Confirma que a tarefa existe e está habilitada no Windows."""\n\n    if sys.platform != "win32":\n        return False\n    task_xml_output = _query_task_xml()\n    if task_xml_output is None:\n        return False\n    if isinstance(task_xml_output, bytes) and not task_xml_output.startswith(\n        (b"\\xff\\xfe", b"\\xfe\\xff", b"<\\x00", b"\\x00<")\n    ):\n        task_xml_output = task_xml_output.decode(errors="replace")\n    try:\n        task_xml = ElementTree.fromstring(task_xml_output)\n    except (ElementTree.ParseError, TypeError):\n        return False\n    enabled = task_xml.find(".//{*}Enabled")\n    if enabled is None:\n        return True\n    return (enabled.text or "").strip().casefold() == "true"\n\n\ndef configure_notification_task(*, enable: bool) -> None:\n    """Ativa ou desativa a tarefa existente sem trocar usuário, SID ou credenciais."""\n\n    if sys.platform != "win32":\n        raise RuntimeError("Os avisos em segundo plano estão disponíveis somente no Windows.")\n    if enable and is_synced_directory(get_data_directory()):\n        raise RuntimeError(\n            "O banco SQLite ativo não deve ficar no OneDrive. Use o OneDrive somente para as cópias de segurança."\n        )\n    if not _task_exists():\n        if not enable:\n            return\n        raise RuntimeError(\n            "A tarefa de notificações do Windows não foi encontrada. Execute novamente o instalador "\n            "do ClimateTest Manager e escolha Reparar/Atualizar; seus dados serão preservados."\n        )\n\n    command = [\n        "schtasks.exe",\n        "/Change",\n        "/TN",\n        TASK_NAME,\n        "/ENABLE" if enable else "/DISABLE",\n    ]\n    result = subprocess.run(\n        command,\n        capture_output=True,\n        text=True,\n        check=False,\n        creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),\n    )\n    if result.returncode != 0:\n        detail = result.stderr.strip() or result.stdout.strip()\n        suffix = f" Detalhe do Windows: {detail}" if detail else ""\n        raise RuntimeError(\n            "O Windows não conseguiu alterar o estado da tarefa de notificações. "\n            "Repare a instalação para restaurar a tarefa sem alterar seus dados." + suffix\n        )\n    if enable:\n        subprocess.run(\n            ["schtasks.exe", "/Run", "/TN", TASK_NAME],\n            capture_output=True,\n            text=True,\n            check=False,\n            creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0),\n        )\n'''
          )

          # Three roles: administrator, operator and read-only consultation.
          replace_once(
              'src/climatetest_manager/services/auth.py',
              '''    @property\n    def role_label(self) -> str:\n        return "Administrador" if self.is_admin else "Operador"\n\n    @property\n    def is_admin(self) -> bool:\n        return self.role == "admin"\n''',
              '''    @property\n    def role_label(self) -> str:\n        if self.is_admin:\n            return "Administrador"\n        if self.is_viewer:\n            return "Consulta"\n        return "Operador"\n\n    @property\n    def is_admin(self) -> bool:\n        return self.role == "admin"\n\n    @property\n    def is_viewer(self) -> bool:\n        return self.role == "viewer"\n\n    @property\n    def can_operate(self) -> bool:\n        return self.role in {"admin", "operator"}\n''',
          )
          text = read('src/climatetest_manager/services/auth.py')
          text = text.replace('{"admin", "operator"}', '{"admin", "operator", "viewer"}')
          if text.count('{"admin", "operator", "viewer"}') < 2:
              raise RuntimeError('auth.py: role validation replacements did not apply')
          write('src/climatetest_manager/services/auth.py', text)

          replace_once(
              'src/climatetest_manager/ui/views/users.py',
              '"Administradores gerenciam contas e também operam ensaios. "\n                        "Operadores acessam todas as funções técnicas, mas não alteram usuários.",',
              '"Administradores gerenciam contas. Operadores executam todas as funções técnicas. "\n                        "O perfil Consulta acompanha ensaios e detalhes sem alterar a operação.",',
          )
          text = read('src/climatetest_manager/ui/views/users.py')
          text = text.replace(
              'ft.DropdownOption(key="operator", text="Operador"),\n                ft.DropdownOption(key="admin", text="Administrador"),',
              'ft.DropdownOption(key="operator", text="Operador"),\n                ft.DropdownOption(key="viewer", text="Consulta — somente leitura"),\n                ft.DropdownOption(key="admin", text="Administrador"),',
          )
          if text.count('key="viewer"') != 2:
              raise RuntimeError('users.py: expected viewer option in create and edit dialogs')
          write('src/climatetest_manager/ui/views/users.py', text)

          # Theme options: 3 light + 3 dark. Amber is inspired by orange/white/charcoal laboratory branding.
          replace_once(
              'src/climatetest_manager/ui/theme.py',
              '''THEME_OPTIONS = (\n    ("light", "Claro", "Leve e neutro"),\n    ("dark", "Escuro", "Confortável em ambientes com pouca luz"),\n''',
              '''THEME_OPTIONS = (\n    ("light", "Claro", "Leve e neutro"),\n    ("amber", "Âmbar", "Laranja, branco e grafite com alto contraste"),\n    ("ice", "Gelo", "Claro frio em azul e branco"),\n    ("dark", "Escuro", "Confortável em ambientes com pouca luz"),\n''',
          )
          replace_once(
              'src/climatetest_manager/ui/theme.py',
              '    "dark": {\n',
              '''    "amber": {\n        "PRIMARY": "#D85F00",\n        "PRIMARY_LIGHT": "#FFE8D2",\n        "PAGE_BACKGROUND": "#F6F2EE",\n        "NAV_BACKGROUND": "#FFFEFC",\n        "NAV_SELECTED": "#FFE0C2",\n        "NAV_HOVER": "#FFF1E3",\n        "NAV_TEXT": "#38332F",\n        "SURFACE": "#FFFFFF",\n        "TEXT_PRIMARY": "#211F1D",\n        "TEXT_SECONDARY": "#6C625A",\n        "DIVIDER": "#E5D8CC",\n        "WARNING": "#B94F00",\n        "WARNING_LIGHT": "#FFF0D9",\n        "DANGER": "#C62828",\n        "DANGER_LIGHT": "#FDE4E4",\n        "INFO": "#315D9A",\n        "INFO_LIGHT": "#E4EEF9",\n        "DRYING": "#7450A8",\n        "DRYING_LIGHT": "#EEE7F7",\n        "WHITE": "#FFFFFF",\n        "GLASS_SURFACE": "#F7FFFFFF",\n        "GLASS_SURFACE_ACCENT": "#F4FFF8F2",\n        "GLASS_BORDER": "#B8DFD1C3",\n        "SURFACE_SHADOW": "#1A211F1D",\n        "INTERACTIVE_HOVER": "#18D85F00",\n        "INTERACTIVE_PRESSED": "#2AD85F00",\n        "ACCENT_GLOW": "#34D85F00",\n    },\n    "ice": {\n        "PRIMARY": "#1677A6",\n        "PRIMARY_LIGHT": "#DDF2FA",\n        "PAGE_BACKGROUND": "#F0F7FA",\n        "NAV_BACKGROUND": "#FFFFFF",\n        "NAV_SELECTED": "#D9F0F8",\n        "NAV_HOVER": "#EDF8FC",\n        "NAV_TEXT": "#40566A",\n        "SURFACE": "#FFFFFF",\n        "TEXT_PRIMARY": "#102433",\n        "TEXT_SECONDARY": "#60788B",\n        "DIVIDER": "#D7E7EF",\n        "WARNING": "#C26A00",\n        "WARNING_LIGHT": "#FFF0D8",\n        "DANGER": "#C93643",\n        "DANGER_LIGHT": "#FCE4E7",\n        "INFO": "#2867B2",\n        "INFO_LIGHT": "#E0ECFA",\n        "DRYING": "#7460B7",\n        "DRYING_LIGHT": "#ECE9F8",\n        "WHITE": "#FFFFFF",\n        "GLASS_SURFACE": "#F7FFFFFF",\n        "GLASS_SURFACE_ACCENT": "#F2F4FBFE",\n        "GLASS_BORDER": "#A9CDE2EC",\n        "SURFACE_SHADOW": "#17102433",\n        "INTERACTIVE_HOVER": "#181677A6",\n        "INTERACTIVE_PRESSED": "#2B1677A6",\n        "ACCENT_GLOW": "#341677A6",\n    },\n    "dark": {\n''',
          )

          # Sidebar: no raster scaling; capture palette values at build time to prevent hover color leakage.
          regex_once(
              'src/climatetest_manager/ui/interaction.py',
              r'def hoverable_navigation_surface\(.*?\n\ndef glass_surface',
              '''def hoverable_navigation_surface(\n    *,\n    label: str,\n    icon: ft.IconData,\n    selected: bool,\n    compact: bool,\n    icon_size: int,\n    on_click: Callable[[], None] | None,\n    badge_count: int = 0,\n) -> ft.Container:\n    """Item lateral nítido e estável, sem escalar texto ou ícones durante o hover."""\n\n    nav_selected = AppColors.NAV_SELECTED\n    nav_hover = AppColors.NAV_HOVER\n    nav_text = AppColors.NAV_TEXT\n    primary = AppColors.PRIMARY\n    text_primary = AppColors.TEXT_PRIMARY\n    selected_color = primary if selected else nav_text\n    label_control = ft.Text(\n        label,\n        size=13,\n        weight=ft.FontWeight.BOLD if selected else ft.FontWeight.W_500,\n        color=selected_color,\n        visible=not compact,\n        no_wrap=True,\n    )\n    icon_control = ft.Icon(icon, size=icon_size, color=selected_color)\n    surface = ft.Container(\n        height=46,\n        border_radius=12,\n        bgcolor=nav_selected if selected else None,\n        padding=ft.Padding.symmetric(horizontal=12 if not compact else 8, vertical=8),\n        alignment=ft.Alignment.CENTER if compact else ft.Alignment.CENTER_LEFT,\n        tooltip=label if compact else None,\n        animate=ft.Animation(120, ft.AnimationCurve.EASE_OUT_CUBIC),\n        on_click=(lambda _event: on_click()) if on_click else None,\n        badge=(\n            ft.Badge(\n                label=str(min(badge_count, 99)),\n                bgcolor=AppColors.DANGER,\n                text_color=AppColors.WHITE,\n            )\n            if badge_count\n            else None\n        ),\n        content=ft.Row(\n            alignment=ft.MainAxisAlignment.CENTER if compact else ft.MainAxisAlignment.START,\n            spacing=0 if compact else 11,\n            controls=[icon_control, label_control],\n        ),\n    )\n\n    def on_hover(event: ft.HoverEvent) -> None:\n        hovering = event.data == "true"\n        if selected:\n            surface.bgcolor = nav_selected\n            icon_control.color = primary\n            label_control.color = primary\n        elif hovering:\n            surface.bgcolor = nav_hover\n            icon_control.color = primary\n            label_control.color = text_primary\n        else:\n            surface.bgcolor = None\n            icon_control.color = nav_text\n            label_control.color = nav_text\n        with suppress(RuntimeError):\n            surface.update()\n\n    if on_click is not None:\n        surface.on_hover = on_hover\n        with suppress(Exception):\n            surface.mouse_cursor = ft.MouseCursor.CLICK\n    return surface\n\n\ndef glass_surface''',
          )

          # Hide the New Test nav item entirely for read-only accounts.
          regex_once(
              'src/climatetest_manager/ui/shell.py',
              r'    navigation = \[.*?\n    if on_users is not None:',
              '''    navigation = [\n        ("Dashboard", ft.Icons.DASHBOARD_OUTLINED, "dashboard", on_dashboard, 0),\n        ("Ensaios", ft.Icons.LIST_ALT_OUTLINED, "tests", on_tests, 0),\n    ]\n    if on_new_test is not None:\n        navigation.append(\n            ("Novo ensaio", ft.Icons.ADD_CIRCLE_OUTLINE, "new_test", on_new_test, 0)\n        )\n    navigation.extend(\n        [\n            ("Agenda", ft.Icons.CALENDAR_MONTH_OUTLINED, "agenda", on_agenda, 0),\n            ("Atividades", ft.Icons.HISTORY, "history", on_history, 0),\n            (\n                "Notificações",\n                ft.Icons.NOTIFICATIONS_OUTLINED,\n                "notifications",\n                on_notifications,\n                notification_count,\n            ),\n            ("Guia de uso", ft.Icons.HELP_OUTLINE, "help", on_help, 0),\n            ("Configurações", ft.Icons.SETTINGS_OUTLINED, "settings", on_settings, 0),\n        ]\n    )\n    if on_users is not None:''',
          )

          # Shorter sample label avoids wrapping inside the compact production card.
          replace_once(
              'src/climatetest_manager/ui/views/new_test.py',
              '            "Quantidade de amostras *",\n',
              '            "Qtd. de amostras *",\n',
          )

          # Production new-test page: full-width identity fields + bounded ListView scrolling.
          regex_once(
              'src/climatetest_manager/ui/views/polished_new_test.py',
              r'    def _identity_panel\(self\) -> ft\.Container:.*?\n    def _thermal_panel',
              '''    def _identity_panel(self) -> ft.Container:\n        return glass_surface(\n            ft.Column(\n                spacing=12,\n                horizontal_alignment=ft.CrossAxisAlignment.STRETCH,\n                controls=[\n                    section_heading(\n                        "Identificação do ensaio",\n                        "Dados essenciais do processo e das amostras.",\n                    ),\n                    self.client,\n                    ft.ResponsiveRow(\n                        spacing=12,\n                        run_spacing=10,\n                        controls=[\n                            ft.Container(col={"xs": 12, "sm": 8}, content=self.process_number),\n                            ft.Container(col={"xs": 12, "sm": 4}, content=self.sample_quantity),\n                        ],\n                    ),\n                    self.product,\n                ],\n            ),\n            padding=18,\n        )\n\n    def _thermal_panel''',
          )
          replace_once(
              'src/climatetest_manager/ui/views/polished_new_test.py',
              '    def _build(self) -> ft.Column:\n',
              '    def _build(self) -> ft.ListView:\n',
          )
          replace_once(
              'src/climatetest_manager/ui/views/polished_new_test.py',
              '''        return ft.Column(\n            expand=True,\n            scroll=ft.ScrollMode.AUTO,\n            spacing=16,\n            horizontal_alignment=ft.CrossAxisAlignment.STRETCH,\n''',
              '''        return ft.ListView(\n            expand=True,\n            spacing=16,\n''',
          )

          # Read-only details and stable bounded scrolling.
          replace_once(
              'src/climatetest_manager/ui/views/polished_test_details.py',
              '        on_admin_delete: Callable[[str], None] | None = None,\n        on_advance_for_testing=None,\n',
              '        on_admin_delete: Callable[[str], None] | None = None,\n        on_advance_for_testing=None,\n        read_only: bool = False,\n',
          )
          replace_once(
              'src/climatetest_manager/ui/views/polished_test_details.py',
              '        self._polished_admin_delete = on_admin_delete\n        super().__init__(\n',
              '        self._polished_admin_delete = on_admin_delete\n        self._read_only = read_only\n        super().__init__(\n',
          )
          replace_once(
              'src/climatetest_manager/ui/views/polished_test_details.py',
              '''        header_actions: list[ft.Control] = [\n            ft.Button(\n                content="Corrigir dados",\n                icon=ft.Icons.EDIT_OUTLINED,\n                on_click=lambda _event: self._polished_on_edit(),\n            )\n        ]\n        if any(\n''',
              '''        header_actions: list[ft.Control] = []\n        if not self._read_only:\n            header_actions.append(\n                ft.Button(\n                    content="Corrigir dados",\n                    icon=ft.Icons.EDIT_OUTLINED,\n                    on_click=lambda _event: self._polished_on_edit(),\n                )\n            )\n        if not self._read_only and any(\n''',
          )
          replace_once(
              'src/climatetest_manager/ui/views/polished_test_details.py',
              '''        return ft.Column(\n            expand=True,\n            scroll=ft.ScrollMode.AUTO,\n            spacing=15,\n            horizontal_alignment=ft.CrossAxisAlignment.STRETCH,\n''',
              '''        return ft.ListView(\n            expand=True,\n            spacing=15,\n''',
          )
          replace_once(
              'src/climatetest_manager/ui/views/polished_test_details.py',
              '''    def _action_panel(self) -> ft.Container:\n        details = self._details\n''',
              '''    def _action_panel(self) -> ft.Container:\n        details = self._details\n        if self._read_only:\n            return glass_surface(\n                ft.Row(\n                    spacing=9,\n                    controls=[\n                        ft.Icon(ft.Icons.VISIBILITY_OUTLINED, color=AppColors.INFO),\n                        ft.Text(\n                            "Perfil de consulta: informações disponíveis somente para leitura.",\n                            color=AppColors.TEXT_SECONDARY,\n                        ),\n                    ],\n                ),\n                padding=16,\n            )\n''',
          )
          replace_once(
              'src/climatetest_manager/ui/views/polished_test_details.py',
              'def build_polished_test_details_view(details: ClimateTestDetails, **kwargs) -> ft.Column:\n',
              'def build_polished_test_details_view(details: ClimateTestDetails, **kwargs) -> ft.Control:\n',
          )

          # Tests list: viewer sees the records but never receives a dead create button.
          text = read('src/climatetest_manager/ui/views/tests_list.py')
          text = text.replace('on_new_test: Callable[[], None],', 'on_new_test: Callable[[], None] | None,')
          old = '''                                ft.Button(\n                                    content="Novo ensaio",\n                                    icon=ft.Icons.ADD,\n                                    bgcolor=AppColors.PRIMARY,\n                                    color=AppColors.WHITE,\n                                    on_click=lambda _event: on_new_test(),\n                                ),\n'''
          new = '''                                *(\n                                    [\n                                        ft.Button(\n                                            content="Novo ensaio",\n                                            icon=ft.Icons.ADD,\n                                            bgcolor=AppColors.PRIMARY,\n                                            color=AppColors.WHITE,\n                                            on_click=lambda _event: on_new_test(),\n                                        )\n                                    ]\n                                    if on_new_test is not None\n                                    else []\n                                ),\n'''
          if text.count(old) != 1:
              raise RuntimeError('tests_list.py: new-test button block not found')
          text = text.replace(old, new, 1)
          write('src/climatetest_manager/ui/views/tests_list.py', text)

          # Dashboard: optional creation button and no equipment controls for read-only viewers.
          text = read('src/climatetest_manager/ui/views/dashboard.py')
          text = text.replace('on_new_test: Callable[[], None]', 'on_new_test: Callable[[], None] | None')
          old_button = '''                ft.Button(\n                    content="Cadastrar ensaio",\n                    icon=ft.Icons.ADD,\n                    color=AppColors.PRIMARY,\n                    on_click=lambda _event: on_new_test(),\n                ),\n'''
          new_button = '''                *(\n                    [\n                        ft.Button(\n                            content="Cadastrar ensaio",\n                            icon=ft.Icons.ADD,\n                            color=AppColors.PRIMARY,\n                            on_click=lambda _event: on_new_test(),\n                        )\n                    ]\n                    if on_new_test is not None\n                    else []\n                ),\n'''
