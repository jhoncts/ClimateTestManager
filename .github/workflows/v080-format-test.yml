name: v0.8.0 temporary test formatter

on:
  push:
    branches:
      - "feat/v0.8.0-production-polish"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.8.0-production-polish
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format regression test
        run: |
          python -m pip install ruff==0.15.22
          ruff check --fix tests/unit/test_production_polish.py
          ruff format tests/unit/test_production_polish.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_production_polish.py
          git commit -m "style: formatar teste de produção da v0.8.0"
          git push origin HEAD:feat/v0.8.0-production-polish
