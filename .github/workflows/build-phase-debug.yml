name: Windows build phase diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  phase-diagnostic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Stage assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .release-assets -Force | Out-Null
          Copy-Item "src\assets\*" .release-assets -Recurse -Force
          New-Item -ItemType Directory -Path ".release-assets\icons" -Force | Out-Null
          Copy-Item "src\assets\brand\climatetest-logo.png" ".release-assets\favicon.png" -Force
          Copy-Item "src\assets\brand\climatetest-logo.png" ".release-assets\icons\loading-animation.png" -Force
          New-Item -ItemType Directory -Path "dist\ClimateTestManager-v0.7.0" -Force | Out-Null
      - name: Pack desktop client
        shell: pwsh
        run: |
          .\.venv\Scripts\flet.exe pack src/client.py `
            --name ClimateTestManager `
            --icon "src\assets\brand\climatetest.ico" `
            --add-data ".release-assets;assets" `
            --product-name "ClimateTest Manager" `
            --product-version "0.7.0" `
            --file-version "0.7.0.0" `
            --file-description "Cliente desktop do ClimateTest Manager" `
            --company-name "ClimateTest Manager" `
            --copyright "Copyright (c) 2026 Jhon Cleiton" `
            --distpath "dist\ClimateTestManager-v0.7.0" `
            --yes
      - name: Pack central server
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller src/server.py `
            --name ClimateTestServer `
            --noconsole `
            --onefile `
            --icon "src\assets\brand\climatetest.ico" `
            --add-data ".release-assets;assets" `
            --collect-all flet_web `
            --distpath "dist\ClimateTestManager-v0.7.0" `
            --clean `
            --noconfirm
      - name: Pack background notifier
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller src/notifier.py `
            --name ClimateTestNotifier `
            --noconsole `
            --onefile `
            --icon "src\assets\brand\climatetest.ico" `
            --add-data ".release-assets;assets" `
            --distpath "dist\ClimateTestManager-v0.7.0" `
            --clean `
            --noconfirm
      - name: Stage installer files
        shell: pwsh
        run: |
          $releaseDir = "dist\ClimateTestManager-v0.7.0"
          Copy-Item "docs\INSTALACAO_WINDOWS.md" (Join-Path $releaseDir "LEIA-ME-PRIMEIRO.md")
          Copy-Item "src\assets\brand\climatetest.ico" (Join-Path $releaseDir "climatetest.ico")
          Copy-Item "scripts\install_server_tasks.ps1" $releaseDir
          Copy-Item "scripts\uninstall_server_tasks.ps1" $releaseDir
          Copy-Item "scripts\discover_server.ps1" $releaseDir
          $complianceDir = Join-Path $releaseDir "documentacao-conformidade"
          New-Item -ItemType Directory -Path $complianceDir -Force | Out-Null
          Copy-Item "docs\compliance\*" $complianceDir -Recurse -Force
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer and capture output
        id: compile
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\ClimateTestManager.iss" *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\inno-compile.log"
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($code -ne 0) { exit $code }
      - name: Upload compiler diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inno-compile-diagnostic
          if-no-files-found: warn
          path: ${{ runner.temp }}/inno-compile.log
      - name: Fail when compiler failed
        if: steps.compile.outcome == 'failure'
        shell: pwsh
        run: throw "Inno Setup compilation failed; see diagnostic artifact."
