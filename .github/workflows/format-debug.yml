name: Format snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: pip install ruff==0.15.22
      - name: Format changed Python files
        run: |
          ruff format src/climatetest_manager/services/updates.py
          ruff format src/climatetest_manager/ui/components/helpers.py
          ruff format src/climatetest_manager/ui/views/server_status.py
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-python-files
          path: |
            src/climatetest_manager/services/updates.py
            src/climatetest_manager/ui/components/helpers.py
            src/climatetest_manager/ui/views/server_status.py
