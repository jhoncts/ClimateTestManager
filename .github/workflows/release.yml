name: Build Windows release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag and source version
        shell: pwsh
        run: |
          $metadata = Get-Content "src/climatetest_manager/__init__.py" -Raw
          $version = [regex]::Match($metadata, '(?m)^__version__ = "([^"]+)"').Groups[1].Value
          $build = [regex]::Match($metadata, '(?m)^__build_revision__ = "([^"]+)"').Groups[1].Value
          if (-not $version -or -not $build) { throw "Metadados de versão incompletos." }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "A tag $env:GITHUB_REF_NAME não corresponde à versão v$version do código."
          }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_REVISION=$build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Windows code-signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) {
            Write-Warning "Build sem Authenticode: a Release será identificada como não assinada."
            "CTM_UNSIGNED_RELEASE=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "climatetest-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "CTM_SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Verify release candidate
        shell: pwsh
        run: |
          .\.venv\Scripts\ruff.exe check .
          .\.venv\Scripts\ruff.exe format --check .
          .\.venv\Scripts\pytest.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build executables and universal installer
        shell: pwsh
        env:
          CTM_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          CTM_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: .\scripts\build_windows.ps1

      - name: Smoke test packaged server and real desktop window
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "ClimateTestManagerSmokeData"
          $readyFile = Join-Path $env:RUNNER_TEMP "ClimateTestManagerDesktop.ready"
          Remove-Item -LiteralPath $readyFile -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null

          $serverExe = ".\dist\ClimateTestManager-v0.8.7\ClimateTestServer.exe"
          $clientExe = ".\dist\ClimateTestManager-v0.8.7\ClimateTestManager.exe"
          $server = Start-Process `
            -FilePath $serverExe `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18550",
              "--data-directory", "`"$dataDir`""
            ) `
            -PassThru

          $client = $null
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 45; $attempt++) {
              if ($server.HasExited) {
                throw "ClimateTestServer.exe encerrou antes de responder. ExitCode=$($server.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:18550/server-build.txt" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                if (($response.StatusCode -ge 200) -and
                    ($response.StatusCode -lt 300) -and
                    (([string]$response.Content).Trim() -eq $env:BUILD_REVISION)) {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "ClimateTestServer.exe não respondeu ao smoke test na porta 18550."
            }

            $clientCheck = Start-Process `
              -FilePath $clientExe `
              -ArgumentList @("--url", "http://127.0.0.1:18550", "--check-only") `
              -Wait `
              -PassThru
            if ($clientCheck.ExitCode -ne 0) {
              throw "Cliente empacotado não conseguiu validar o servidor. ExitCode=$($clientCheck.ExitCode)"
            }

            $client = Start-Process `
              -FilePath $clientExe `
              -ArgumentList @(
                "--url", "http://127.0.0.1:18550",
                "--ready-file", "`"$readyFile`"",
                "--no-single-instance"
              ) `
              -PassThru

            $desktopReady = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              $client.Refresh()
              if ($client.HasExited) {
                throw "Cliente desktop encerrou antes de montar a interface. ExitCode=$($client.ExitCode)"
              }
              if (Test-Path -LiteralPath $readyFile) {
                $desktopReady = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $desktopReady) {
              throw "A interface desktop real não concluiu a inicialização. A regressão da janela vazia ainda estaria presente."
            }

            $marker = Get-Content -LiteralPath $readyFile -Raw
            if ($marker -notmatch "ClimateTest Manager") {
              throw "O cliente iniciou, mas não confirmou a montagem da interface ClimateTest Manager."
            }
            if ($marker -notmatch [regex]::Escape("http://127.0.0.1:18550")) {
              throw "A interface montada não confirmou o servidor usado no teste."
            }
          }
          finally {
            if ($client -and -not $client.HasExited) {
              Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
            }
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke test universal installer as workstation
        shell: pwsh
        run: |
          $serverData = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstationServerData"
          $clientInstall = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstation"
          $readyFile = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstation.ready"
          $setupLog = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstation-setup.log"
          Remove-Item -LiteralPath $readyFile -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $setupLog -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $serverData -Force | Out-Null

          $serverExe = ".\dist\ClimateTestManager-v0.8.7\ClimateTestServer.exe"
          $setupExe = ".\dist\ClimateTestManager-Setup-v0.8.7.exe"
          $server = Start-Process `
            -FilePath $serverExe `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18552",
              "--data-directory", "`"$serverData`""
            ) `
            -PassThru

          $client = $null
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 45; $attempt++) {
              if ($server.HasExited) {
                throw "Servidor temporário da estação encerrou. ExitCode=$($server.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:18552/server-build.txt" -UseBasicParsing -TimeoutSec 2
                if (($response.StatusCode -ge 200) -and
                    ($response.StatusCode -lt 300) -and
                    (([string]$response.Content).Trim() -eq $env:BUILD_REVISION)) {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Servidor temporário da estação não respondeu."
            }

            $setup = Start-Process `
              -FilePath $setupExe `
              -ArgumentList @(
                "/VERYSILENT",
                "/SUPPRESSMSGBOXES",
                "/NORESTART",
                "/ROLE=client",
                "/SERVERADDRESS=127.0.0.1:18552",
                "/DIR=`"$clientInstall`"",
                "/LOG=`"$setupLog`""
              ) `
              -Wait `
              -PassThru
            if ($setup.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $setupLog) {
                Write-Host "===== LOG DO INSTALADOR EM MODO ESTAÇÃO ====="
                Get-Content -LiteralPath $setupLog
                Write-Host "===== FIM DO LOG DO INSTALADOR ====="
              }
              throw "Instalador universal falhou no modo estação. ExitCode=$($setup.ExitCode)"
            }

            $installedClient = Join-Path $clientInstall "ClimateTestManager.exe"
            if (-not (Test-Path -LiteralPath $installedClient)) {
              throw "Instalador de estação não instalou ClimateTestManager.exe."
            }

            $clientCheck = Start-Process `
              -FilePath $installedClient `
              -ArgumentList @("--check-only") `
              -Wait `
              -PassThru
            if ($clientCheck.ExitCode -ne 0) {
              throw "Estação instalada não usou corretamente o servidor salvo pelo instalador. ExitCode=$($clientCheck.ExitCode)"
            }

            $client = Start-Process `
              -FilePath $installedClient `
              -ArgumentList @("--ready-file", "`"$readyFile`"", "--no-single-instance") `
              -PassThru
            $desktopReady = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              $client.Refresh()
              if ($client.HasExited) {
                throw "Estação instalada encerrou antes de montar a interface. ExitCode=$($client.ExitCode)"
              }
              if (Test-Path -LiteralPath $readyFile) {
                $desktopReady = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $desktopReady) {
              throw "Estação instalada não montou a interface desktop real."
            }

            $marker = Get-Content -LiteralPath $readyFile -Raw
            if ($marker -notmatch "ClimateTest Manager") {
              throw "A estação instalada não confirmou a montagem da interface ClimateTest Manager."
            }
            if ($marker -notmatch [regex]::Escape("http://127.0.0.1:18552")) {
              throw "A estação instalada não usou o servidor persistido pelo instalador."
            }

            if (-not $client.HasExited) {
              Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
              $client = $null
            }

            $serverMarker = Join-Path $clientInstall "server-mode.marker"
            $clientMarker = Join-Path $clientInstall "client-mode.marker"
            if (Test-Path -LiteralPath $serverMarker) {
              throw "Instalação de estação criou marcador de servidor por engano."
            }
            if (-not (Test-Path -LiteralPath $clientMarker)) {
              throw "Instalação de estação não criou marcador de cliente."
            }
            if (Get-ScheduledTask -TaskName "ClimateTestManager-Server" -ErrorAction SilentlyContinue) {
              throw "Instalação de estação criou tarefa de servidor por engano."
            }

            $uninstaller = Join-Path $clientInstall "unins000.exe"
            if (-not (Test-Path -LiteralPath $uninstaller)) {
              throw "Desinstalador da estação não foi criado."
            }
            $uninstall = Start-Process `
              -FilePath $uninstaller `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
              -Wait `
              -PassThru
            if ($uninstall.ExitCode -ne 0) {
              throw "Desinstalação da estação falhou. ExitCode=$($uninstall.ExitCode)"
            }
            $server.Refresh()
            if ($server.HasExited) {
              throw "Desinstalar uma estação encerrou indevidamente o servidor central."
            }
          }
          finally {
            if ($client -and -not $client.HasExited) {
              Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
            }
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke test upgrade as central server
        timeout-minutes: 12
        shell: pwsh
        run: |
          $installDir = Join-Path $env:ProgramFiles "ClimateTest Manager"
          $oldData = Join-Path $env:RUNNER_TEMP "ClimateTestManagerOldData"
          $setupLog = Join-Path $env:RUNNER_TEMP "ClimateTestManagerServer-setup.log"
          $programData = Join-Path $env:ProgramData "ClimateTestManager"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          New-Item -ItemType Directory -Path $oldData -Force | Out-Null
          New-Item -ItemType Directory -Path $programData -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $programData "server-mode.marker") -Value "server" -Encoding ascii
          Copy-Item `
            ".\dist\ClimateTestManager-v0.8.7\ClimateTestServer.exe" `
            (Join-Path $installDir "ClimateTestServer.exe") `
            -Force

          $oldServer = Start-Process `
            -FilePath (Join-Path $installDir "ClimateTestServer.exe") `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18551",
              "--data-directory", "`"$oldData`""
            ) `
            -PassThru

          Start-Sleep -Seconds 4
          if ($oldServer.HasExited) {
            throw "Servidor usado para simular a versão antiga encerrou cedo demais."
          }

          $setup = Start-Process `
            -FilePath ".\dist\ClimateTestManager-Setup-v0.8.7.exe" `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/ROLE=server",
              "/DIR=`"$installDir`"",
              "/LOG=`"$setupLog`""
            ) `
            -PassThru
          if (-not $setup.WaitForExit(240000)) {
            Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $setupLog) {
              Write-Host "===== LOG DO INSTALADOR EM MODO SERVIDOR (TIMEOUT) ====="
              Get-Content -LiteralPath $setupLog
              Write-Host "===== FIM DO LOG DO INSTALADOR ====="
            }
            throw "Instalador do servidor não encerrou em até 4 minutos."
          }
          $setup.Refresh()
          if ($setup.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $setupLog) {
              Write-Host "===== LOG DO INSTALADOR EM MODO SERVIDOR ====="
              Get-Content -LiteralPath $setupLog
              Write-Host "===== FIM DO LOG DO INSTALADOR ====="
            }
            throw "Instalador falhou no teste de atualização do servidor. ExitCode=$($setup.ExitCode)"
          }

          if (Get-Process -Id $oldServer.Id -ErrorAction SilentlyContinue) {
            throw "O instalador não encerrou o servidor antigo antes de substituir o executável."
          }

          $ready = $false
          for ($attempt = 1; $attempt -le 45; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:8550/server-build.txt" `
                -UseBasicParsing `
                -TimeoutSec 2
              if (($response.StatusCode -ge 200) -and
                  ($response.StatusCode -lt 300) -and
                  (([string]$response.Content).Trim() -eq $env:BUILD_REVISION)) {
                $ready = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            throw "Servidor instalado não publicou $env:BUILD_REVISION após a atualização."
          }

          $installStatusPath = Join-Path $env:ProgramData "ClimateTestManager\install-status.json"
          if (-not (Test-Path -LiteralPath $installStatusPath)) {
            throw "A atualização não gerou o diagnóstico install-status.json."
          }
          $installStatus = Get-Content -LiteralPath $installStatusPath -Raw | ConvertFrom-Json
          if (($installStatus.version -ne $env:APP_VERSION) -or
              ($installStatus.build_revision -ne $env:BUILD_REVISION)) {
            throw "O diagnóstico não confirma $env:APP_VERSION / $env:BUILD_REVISION."
          }

          $approvedInstaller = Join-Path `
            $programData `
            "ApprovedUpdates\ClimateTestManager-Setup-v$($env:APP_VERSION).exe"
          if (-not (Test-Path -LiteralPath $approvedInstaller)) {
            throw "O servidor não preservou o instalador aprovado para distribuição às estações."
          }
          foreach ($tool in @(
            "deploy_update_to_stations.ps1",
            "enable_remote_update_station.ps1"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $tool))) {
              throw "Ferramenta de atualização controlada ausente: $tool"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $programData "stations.txt"))) {
            throw "A instalação não criou a lista inicial de estações."
          }

          $installedClient = Join-Path $installDir "ClimateTestManager.exe"
          $clientCheck = Start-Process `
            -FilePath $installedClient `
            -ArgumentList @("--check-only") `
            -Wait `
            -PassThru
          if ($clientCheck.ExitCode -ne 0) {
            throw "Cliente desktop instalado no servidor não conseguiu alcançar o servidor central."
          }

          $serverMarker = Join-Path $installDir "server-mode.marker"
          if (-not (Test-Path -LiteralPath $serverMarker)) {
            throw "Instalação do servidor não criou o marcador de servidor."
          }

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $installer = ".\dist\ClimateTestManager-Setup-v0.8.7.exe"
          $hashFile = ".\dist\ClimateTestManager-Setup-v0.8.7-SHA256.txt"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Instalador final não foi gerado."
          }
          if (-not (Test-Path -LiteralPath $hashFile)) {
            throw "Arquivo SHA-256 não foi gerado."
          }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared = (Get-Content -LiteralPath $hashFile -Raw).ToLowerInvariant()
          if ($declared -notmatch [regex]::Escape($actual)) {
            throw "SHA-256 publicado não corresponde ao instalador gerado."
          }

          $manifest = Get-Content ".\dist\update-manifest.json" -Raw | ConvertFrom-Json
          if (($manifest.version -ne $env:APP_VERSION) -or
              ($manifest.build_revision -ne $env:BUILD_REVISION) -or
              ($manifest.installer.sha256 -ne $actual)) {
            throw "Manifesto global não corresponde ao instalador validado."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($env:CTM_UNSIGNED_RELEASE -eq "true" -and $signature.Status -eq "Valid") {
            throw "O workflow marcou a Release como não assinada, mas encontrou uma assinatura."
          }
          if ($env:CTM_UNSIGNED_RELEASE -ne "true" -and $signature.Status -ne "Valid") {
            throw "O certificado foi configurado, mas o instalador final não possui assinatura válida."
          }

      - name: Attest release provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: dist/ClimateTestManager-Setup-v0.8.7.exe

      - name: Upload validated Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClimateTestManager-v0.8.7-Windows-Validated
          if-no-files-found: error
          path: |
            dist/ClimateTestManager-Setup-v0.8.7.exe
            dist/ClimateTestManager-Setup-v0.8.7-SHA256.txt
            dist/ClimateTestManager-v0.8.7-windows.zip
            dist/update-manifest.json

      - name: Publish GitHub release only from a tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesFile = "docs/RELEASE_V$($env:APP_VERSION.Replace('.', '')).md"
          if (-not (Test-Path -LiteralPath $notesFile)) {
            throw "Notas obrigatórias não encontradas: $notesFile"
          }
          gh release create "${{ github.ref_name }}" `
            "dist/ClimateTestManager-Setup-v0.8.7.exe" `
            "dist/ClimateTestManager-Setup-v0.8.7-SHA256.txt" `
            "dist/ClimateTestManager-v0.8.7-windows.zip" `
            "dist/update-manifest.json" `
            --target "${{ github.sha }}" `
            --title "ClimateTest Manager ${{ github.ref_name }}" `
            --notes-file $notesFile
