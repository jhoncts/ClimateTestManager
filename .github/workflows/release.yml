name: Build Windows release

on:
  pull_request:
  push:
    branches:
      - "release/v0.6.2"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Verify release candidate
        shell: pwsh
        run: |
          .\.venv\Scripts\ruff.exe check .
          .\.venv\Scripts\ruff.exe format --check .
          .\.venv\Scripts\pytest.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build executables and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClimateTestManager-v0.6.2-Windows
          if-no-files-found: error
          path: |
            dist/ClimateTestManager-Server-Setup-v0.6.2.exe
            dist/ClimateTestManager-v0.6.2-windows.zip

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/release/v0.6.2' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = if ("${{ github.ref }}" -like "refs/tags/*") {
            "${{ github.ref_name }}"
          } else {
            "v0.6.2"
          }
          gh release create $releaseTag `
            "dist/ClimateTestManager-Server-Setup-v0.6.2.exe" `
            "dist/ClimateTestManager-v0.6.2-windows.zip" `
            --target "${{ github.sha }}" `
            --title "ClimateTest Manager $releaseTag" `
            --generate-notes
