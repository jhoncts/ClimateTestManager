name: Build Windows release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply validated UI-FIX-7 overlay
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath ".release-candidate\ui-fix7-overlay.zip" -DestinationPath "." -Force
          Write-Host "UI-FIX-7 overlay applied before tests and packaging."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Verify release candidate
        shell: pwsh
        run: |
          .\.venv\Scripts\ruff.exe check .
          .\.venv\Scripts\ruff.exe format --check .
          .\.venv\Scripts\pytest.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build executables and universal installer
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Smoke test packaged server and real desktop window
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "ClimateTestManagerSmokeData"
          $readyFile = Join-Path $env:RUNNER_TEMP "ClimateTestManagerDesktop.ready"
          Remove-Item -LiteralPath $readyFile -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null

          $serverExe = ".\dist\ClimateTestManager-v0.8.5\ClimateTestServer.exe"
          $clientExe = ".\dist\ClimateTestManager-v0.8.5\ClimateTestManager.exe"
          $server = Start-Process `
            -FilePath $serverExe `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18550",
              "--data-directory", "`"$dataDir`""
            ) `
            -PassThru

          $client = $null
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 45; $attempt++) {
              if ($server.HasExited) {
                throw "ClimateTestServer.exe encerrou antes de responder. ExitCode=$($server.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:18550/server-build.txt" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                if (($response.StatusCode -ge 200) -and
                    ($response.StatusCode -lt 300) -and
                    (([string]$response.Content).Trim() -eq "R9-20260814")) {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "ClimateTestServer.exe nÃ£o respondeu ao smoke test na porta 18550."
            }

            $clientCheck = Start-Process `
              -FilePath $clientExe `
              -ArgumentList @("--url", "http://127.0.0.1:18550", "--check-only") `
              -Wait `
              -PassThru
            if ($clientCheck.ExitCode -ne 0) {
              throw "Cliente empacotado nÃ£o conseguiu validar o servidor. ExitCode=$($clientCheck.ExitCode)"
            }

            $client = Start-Process `
              -FilePath $clientExe `
              -ArgumentList @(
                "--url", "http://127.0.0.1:18550",
                "--ready-file", "`"$readyFile`"",
                "--no-single-instance"
              ) `
              -PassThru

            $desktopReady = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              $client.Refresh()
              if ($client.HasExited) {
                throw "Cliente desktop encerrou antes de montar a interface. ExitCode=$($client.ExitCode)"
              }
              if (Test-Path -LiteralPath $readyFile) {
                $desktopReady = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $desktopReady) {
              throw "A interface desktop real nÃ£o concluiu a inicializaÃ§Ã£o. A regressÃ£o da janela vazia ainda estaria presente."
            }

            $marker = Get-Content -LiteralPath $readyFile -Raw
            if ($marker -notmatch "ClimateTest Manager") {
              throw "O cliente iniciou, mas nÃ£o confirmou a montagem da interface ClimateTest Manager."
            }
            if ($marker -notmatch [regex]::Escape("http://127.0.0.1:18550")) {
              throw "A interface montada nÃ£o confirmou o servidor usado no teste."
            }
          }
          finally {
            if ($client -and -not $client.HasExited) {
              Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
            }
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke test universal installer as workstation
        shell: pwsh
        run: |
          $serverData = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstationServerData"
          $clientInstall = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstation"
          $readyFile = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstation.ready"
          $setupLog = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstation-setup.log"
          Remove-Item -LiteralPath $readyFile -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $setupLog -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $serverData -Force | Out-Null

          $serverExe = ".\dist\ClimateTestManager-v0.8.5\ClimateTestServer.exe"
          $setupExe = ".\dist\ClimateTestManager-Setup-v0.8.5.exe"
          $server = Start-Process `
            -FilePath $serverExe `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18552",
              "--data-directory", "`"$serverData`""
            ) `
            -PassThru

          $client = $null
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 45; $attempt++) {
              if ($server.HasExited) {
                throw "Servidor temporÃ¡rio da estaÃ§Ã£o encerrou. ExitCode=$($server.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:18552/server-build.txt" -UseBasicParsing -TimeoutSec 2
                if (($response.StatusCode -ge 200) -and
                    ($response.StatusCode -lt 300) -and
                    (([string]$response.Content).Trim() -eq "R9-20260814")) {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Servidor temporÃ¡rio da estaÃ§Ã£o nÃ£o respondeu."
            }

            $setup = Start-Process `
              -FilePath $setupExe `
              -ArgumentList @(
                "/VERYSILENT",
                "/SUPPRESSMSGBOXES",
                "/NORESTART",
                "/ROLE=client",
                "/SERVERADDRESS=127.0.0.1:18552",
                "/DIR=`"$clientInstal`"",
                "/LOG=`"$setupLog`""
            ) `
              -Wait `
              -PassThru
            if ($setup.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $setupLog) {
                Write-Host "===== LOG DO INSTALADOR EM MODO ESTAÃ‡ÃƒO ====="
                Get-Content -LiteralPath $setupLog
                Write-Host "===== FIM DO LOG DO INSTALADOR ====="
              }
              throw "Instalador universal falhou no modo estaÃ§Ã£o. ExitCode=$($setup.ExitCode)"
            }

            $installedClient = Join-Path $clientInstall "ClimateTestManager.exe"
            if (-not (Test-Path -LiteralPath $installedClient)) {
              throw "Instalador de estaÃ§Ã£o nÃ£o instalou ClimateTestManager.exe."
            }

            $clientCheck = Start-Process `
              -FilePath $installedClient `
              -ArgumentList @("--check-only") `
              -Wait `
              -PassThru
            if ($clientCheck.ExitCode -ne 0) {
              throw "EstaÃ§Ã£o instalada nÃ£o usou corretamente o servidor salvo pelo instalador. ExitCode=$($clientCheck.ExitCode)"
            }

            $client = Start-Process `
              -FilePath $installedClient `
              -ArgumentList @("--ready-file", "`"$readyFile`"", "--no-single-instance") `
              -PassThru
            $desktopReady = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              $client.Refresh()
              if ($client.HasExited) {
                throw "EstaÃ§Ã£o instalada encerrou antes de montar a interface. ExitCode=$($client.ExitCode)"
              }
              if (Test-Path -LiteralPath $readyFile) {
                $desktopReady = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $desktopReady) {
              throw "EstaÃ§Ã£o instalada nÃ£o montou a interface desktop real."
            }

            $marker = Get-Content -LiteralPath $readyFile -Raw
            if ($marker -notmatch "ClimateTest Manager") {
              throw "A estaÃ§Ã£o instalada nÃ£o confirmou a interface ClimateTest Manager."
            }
            if ($marker -notmatch [regex]::Escape("http://127.0.0.1:18552")) {
              throw "A estaÃ§Ã£o instalada nÃ£o usee o: servidor persistido pelo instalador."
            }

            if (-not $client.HasExited) {
              Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
              $client = $null
            }

            $serverMarker = Join-Path $clientInstall "server-mode.marker"
            $clientMarker = Join-Path $clientInstall "client-mode.marker"
            if (Test-Path -LiteralPath $serverMarker) {
              throw "InstalaÃ§Ã£o de estaÃ§Ã£o criou marcador de servidor por engano."
            }
            if (-not (Test-Path -LiteralPath $clientMarker)) {
              throw "InstalaÃ§Ã£o de estaÃ§Ã£o nÃ£o criou marcador de cliente."
            }
            if (Get-ScheduledTask -TaskName "ClimateTestManager-Server" -ErrorAction SilentlyContinue) {
              throw "InstalaÃ§Ã£o de estaÃ§Ã£o criou tarefa de servidor por engano."
            }

            $uninstaller = Join-Path $clientInstall "unins000.exe"
            if (-not (Test-Path -LiteralPath $uninstaller)) {
              throw "Desinstalador da estaÃ§Ã£o nÃ£o foi criado."
            }
            $uninstall = Start-Process `
              -FilePath $uninstaller `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
              -Wait `
              -PassThru
            if ($uninstall.ExitCode -ne 0) {
              throw "DesinstalaÃ§Ã£o da estaÃ§Ã£o falhou. ExitCode=$($uninstall.ExitCode)"
            }
            $server.Refresh()
            if ($server.HasExited) {
              throw "Desinstalar uma estaÃ§Ã£o encerrou indevidamente o servidor central."
            }
          }
          finally {
            if ($client -and -not $client.HasExited) {
              Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
            }
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke test upgrade as central server
        shell: pwsh
        run: |
          $installDir = Join-Path $env:ProgramFiles "ClimateTest Manager"
          $oldData = Join-Path $env:RUNNER_TEMP "ClimateTestManagerOldData"
          $setupLog = Join-Path $env:RUNNER_TEMP "ClimateTestManagerServer-setup.log"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          New-Item -ItemType Directory -Path $oldData -Force | Out-Null
          Copy-Item `
            ".\dist\ClimateTestManager-v0.8.5\ClimateTestServer.exe" `
            (Join-Path $installDir "ClimateTestServer.exe") `
            -Force

          $oldServer = Start-Process `
            -FilePath (Join-Path $installDir "ClimateTestServer.exe") `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18551",
              "--data-directory", "`"$oldData`""
            ) `
            -PassThru

