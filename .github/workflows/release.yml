name: Build Windows release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Verify release candidate
        shell: pwsh
        run: |
          .\.venv\Scripts\ruff.exe check .
          .\.venv\Scripts\ruff.exe format --check .
          .\.venv\Scripts\pytest.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build executables and universal installer
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Smoke test packaged server and real desktop window
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "ClimateTestManagerSmokeData"
          $readyFile = Join-Path $env:RUNNER_TEMP "ClimateTestManagerDesktop.ready"
          Remove-Item -LiteralPath $readyFile -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null

          $serverExe = ".\dist\ClimateTestManager-v0.7.0\ClimateTestServer.exe"
          $clientExe = ".\dist\ClimateTestManager-v0.7.0\ClimateTestManager.exe"
          $server = Start-Process `
            -FilePath $serverExe `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18550",
              "--data-directory", "`"$dataDir`""
            ) `
            -PassThru

          $client = $null
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 45; $attempt++) {
              if ($server.HasExited) {
                throw "ClimateTestServer.exe encerrou antes de responder. ExitCode=$($server.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:18550/" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "ClimateTestServer.exe não respondeu ao smoke test na porta 18550."
            }

            $clientCheck = Start-Process `
              -FilePath $clientExe `
              -ArgumentList @("--url", "http://127.0.0.1:18550", "--check-only") `
              -Wait `
              -PassThru
            if ($clientCheck.ExitCode -ne 0) {
              throw "Cliente empacotado não conseguiu validar o servidor. ExitCode=$($clientCheck.ExitCode)"
            }

            $client = Start-Process `
              -FilePath $clientExe `
              -ArgumentList @(
                "--url", "http://127.0.0.1:18550",
                "--ready-file", "`"$readyFile`""
              ) `
              -PassThru

            $desktopReady = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              $client.Refresh()
              if ($client.HasExited) {
                throw "Cliente desktop encerrou antes de montar a interface. ExitCode=$($client.ExitCode)"
              }
              if (Test-Path -LiteralPath $readyFile) {
                $desktopReady = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $desktopReady) {
              throw "A interface desktop real não concluiu a inicialização. A regressão da janela vazia ainda estaria presente."
            }

            $marker = Get-Content -LiteralPath $readyFile -Raw
            if ($marker -notmatch "ClimateTest Manager") {
              throw "O cliente iniciou, mas não confirmou a montagem da interface ClimateTest Manager."
            }
            if ($marker -notmatch [regex]::Escape("http://127.0.0.1:18550")) {
              throw "A interface montada não confirmou o servidor usado no teste."
            }
          }
          finally {
            if ($client -and -not $client.HasExited) {
              Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
            }
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke test universal installer as workstation
        shell: pwsh
        run: |
          $serverData = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstationServerData"
          $clientInstall = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstation"
          $readyFile = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstation.ready"
          $setupLog = Join-Path $env:RUNNER_TEMP "ClimateTestManagerWorkstation-setup.log"
          Remove-Item -LiteralPath $readyFile -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $setupLog -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $serverData -Force | Out-Null

          $serverExe = ".\dist\ClimateTestManager-v0.7.0\ClimateTestServer.exe"
          $setupExe = ".\dist\ClimateTestManager-Setup-v0.7.0.exe"
          $server = Start-Process `
            -FilePath $serverExe `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18552",
              "--data-directory", "`"$serverData`""
            ) `
            -PassThru

          $client = $null
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 45; $attempt++) {
              if ($server.HasExited) {
                throw "Servidor temporário da estação encerrou. ExitCode=$($server.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:18552/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Servidor temporário da estação não respondeu."
            }

            $setup = Start-Process `
              -FilePath $setupExe `
              -ArgumentList @(
                "/VERYSILENT",
                "/SUPPRESSMSGBOXES",
                "/NORESTART",
                "/ROLE=client",
                "/SERVERADDRESS=127.0.0.1:18552",
                "/DIR=`"$clientInstall`"",
                "/LOG=`"$setupLog`""
              ) `
              -Wait `
              -PassThru
            if ($setup.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $setupLog) {
                Write-Host "===== LOG DO INSTALADOR EM MODO ESTAÇÃO ====="
                Get-Content -LiteralPath $setupLog
                Write-Host "===== FIM DO LOG DO INSTALADOR ====="
              }
              throw "Instalador universal falhou no modo estação. ExitCode=$($setup.ExitCode)"
            }

            $installedClient = Join-Path $clientInstall "ClimateTestManager.exe"
            if (-not (Test-Path -LiteralPath $installedClient)) {
              throw "Instalador de estação não instalou ClimateTestManager.exe."
            }

            $clientCheck = Start-Process `
              -FilePath $installedClient `
              -ArgumentList @("--check-only") `
              -Wait `
              -PassThru
            if ($clientCheck.ExitCode -ne 0) {
              throw "Estação instalada não usou corretamente o servidor salvo pelo instalador. ExitCode=$($clientCheck.ExitCode)"
            }

            $client = Start-Process `
              -FilePath $installedClient `
              -ArgumentList @("--ready-file", "`"$readyFile`"") `
              -PassThru
            $desktopReady = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              $client.Refresh()
              if ($client.HasExited) {
                throw "Estação instalada encerrou antes de montar a interface. ExitCode=$($client.ExitCode)"
              }
              if (Test-Path -LiteralPath $readyFile) {
                $desktopReady = $true
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $desktopReady) {
              throw "Estação instalada não montou a interface desktop real."
            }

            $marker = Get-Content -LiteralPath $readyFile -Raw
            if ($marker -notmatch "ClimateTest Manager") {
              throw "A estação instalada não confirmou a montagem da interface ClimateTest Manager."
            }
            if ($marker -notmatch [regex]::Escape("http://127.0.0.1:18552")) {
              throw "A estação instalada não usou o servidor persistido pelo instalador."
            }

            if (-not $client.HasExited) {
              Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
              $client = $null
            }

            $serverMarker = Join-Path $clientInstall "server-mode.marker"
            $clientMarker = Join-Path $clientInstall "client-mode.marker"
            if (Test-Path -LiteralPath $serverMarker) {
              throw "Instalação de estação criou marcador de servidor por engano."
            }
            if (-not (Test-Path -LiteralPath $clientMarker)) {
              throw "Instalação de estação não criou marcador de cliente."
            }
            if (Get-ScheduledTask -TaskName "ClimateTestManager-Server" -ErrorAction SilentlyContinue) {
              throw "Instalação de estação criou tarefa de servidor por engano."
            }

            $uninstaller = Join-Path $clientInstall "unins000.exe"
            if (-not (Test-Path -LiteralPath $uninstaller)) {
              throw "Desinstalador da estação não foi criado."
            }
            $uninstall = Start-Process `
              -FilePath $uninstaller `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
              -Wait `
              -PassThru
            if ($uninstall.ExitCode -ne 0) {
              throw "Desinstalação da estação falhou. ExitCode=$($uninstall.ExitCode)"
            }
            $server.Refresh()
            if ($server.HasExited) {
              throw "Desinstalar uma estação encerrou indevidamente o servidor central."
            }
          }
          finally {
            if ($client -and -not $client.HasExited) {
              Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
            }
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Smoke test upgrade as central server
        shell: pwsh
        run: |
          $installDir = Join-Path $env:ProgramFiles "ClimateTest Manager"
          $oldData = Join-Path $env:RUNNER_TEMP "ClimateTestManagerOldData"
          $setupLog = Join-Path $env:RUNNER_TEMP "ClimateTestManagerServer-setup.log"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          New-Item -ItemType Directory -Path $oldData -Force | Out-Null
          Copy-Item `
            ".\dist\ClimateTestManager-v0.7.0\ClimateTestServer.exe" `
            (Join-Path $installDir "ClimateTestServer.exe") `
            -Force

          $oldServer = Start-Process `
            -FilePath (Join-Path $installDir "ClimateTestServer.exe") `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18551",
              "--data-directory", "`"$oldData`""
            ) `
            -PassThru

          Start-Sleep -Seconds 4
          if ($oldServer.HasExited) {
            throw "Servidor usado para simular a versão antiga encerrou cedo demais."
          }

          $setup = Start-Process `
            -FilePath ".\dist\ClimateTestManager-Setup-v0.7.0.exe" `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/ROLE=server",
              "/DIR=`"$installDir`"",
              "/LOG=`"$setupLog`""
            ) `
            -PassThru
          if (-not $setup.WaitForExit(240000)) {
            Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $setupLog) {
              Write-Host "===== LOG DO INSTALADOR EM MODO SERVIDOR (TIMEOUT) ====="
              Get-Content -LiteralPath $setupLog
              Write-Host "===== FIM DO LOG DO INSTALADOR ====="
            }
            throw "Instalador do servidor não encerrou em até 4 minutos."
          }
          $setup.Refresh()
          if ($setup.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $setupLog) {
              Write-Host "===== LOG DO INSTALADOR EM MODO SERVIDOR ====="
              Get-Content -LiteralPath $setupLog
              Write-Host "===== FIM DO LOG DO INSTALADOR ====="
            }
            throw "Instalador falhou no teste de atualização do servidor. ExitCode=$($setup.ExitCode)"
          }

          if (Get-Process -Id $oldServer.Id -ErrorAction SilentlyContinue) {
            throw "O instalador não encerrou o servidor antigo antes de substituir o executável."
          }

          $ready = $false
          for ($attempt = 1; $attempt -le 45; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:8550/" `
                -UseBasicParsing `
                -TimeoutSec 2
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                $ready = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            throw "Servidor instalado não respondeu após o teste de atualização."
          }

          $installedClient = Join-Path $installDir "ClimateTestManager.exe"
          $clientCheck = Start-Process `
            -FilePath $installedClient `
            -ArgumentList @("--check-only") `
            -Wait `
            -PassThru
          if ($clientCheck.ExitCode -ne 0) {
            throw "Cliente desktop instalado no servidor não conseguiu alcançar o servidor central."
          }

          $serverMarker = Join-Path $installDir "server-mode.marker"
          if (-not (Test-Path -LiteralPath $serverMarker)) {
            throw "Instalação do servidor não criou o marcador de servidor."
          }

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $installer = ".\dist\ClimateTestManager-Setup-v0.7.0.exe"
          $hashFile = ".\dist\ClimateTestManager-Setup-v0.7.0-SHA256.txt"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Instalador final não foi gerado."
          }
          if (-not (Test-Path -LiteralPath $hashFile)) {
            throw "Arquivo SHA-256 não foi gerado."
          }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared = (Get-Content -LiteralPath $hashFile -Raw).ToLowerInvariant()
          if ($declared -notmatch [regex]::Escape($actual)) {
            throw "SHA-256 publicado não corresponde ao instalador gerado."
          }

      - name: Upload validated Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClimateTestManager-v0.7.0-Windows-Validated
          if-no-files-found: error
          path: |
            dist/ClimateTestManager-Setup-v0.7.0.exe
            dist/ClimateTestManager-Setup-v0.7.0-SHA256.txt
            dist/ClimateTestManager-v0.7.0-windows.zip

      - name: Publish GitHub release only from a tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/ClimateTestManager-Setup-v0.7.0.exe" `
            "dist/ClimateTestManager-Setup-v0.7.0-SHA256.txt" `
            "dist/ClimateTestManager-v0.7.0-windows.zip" `
            --target "${{ github.sha }}" `
            --title "ClimateTest Manager ${{ github.ref_name }}" `
            --generate-notes
