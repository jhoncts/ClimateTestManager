name: Build Windows release

on:
  pull_request:
  push:
    branches:
      - "release/v0.7.0"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Verify release candidate
        shell: pwsh
        run: |
          .\.venv\Scripts\ruff.exe check .
          .\.venv\Scripts\ruff.exe format --check .
          .\.venv\Scripts\pytest.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build executables and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Smoke test packaged server and desktop client
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "ClimateTestManagerSmokeData"
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $serverExe = ".\dist\ClimateTestManager-v0.7.0\ClimateTestServer.exe"
          $clientExe = ".\dist\ClimateTestManager-v0.7.0\ClimateTestManager.exe"
          $server = Start-Process `
            -FilePath $serverExe `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18550",
              "--data-directory", "`"$dataDir`""
            ) `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 45; $attempt++) {
              if ($server.HasExited) {
                throw "ClimateTestServer.exe encerrou antes de responder. ExitCode=$($server.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:18550/" `
                  -UseBasicParsing `
                  -TimeoutSec 2
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                  $ready = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "ClimateTestServer.exe não respondeu ao smoke test na porta 18550."
            }

            $clientCheck = Start-Process `
              -FilePath $clientExe `
              -ArgumentList @("--url", "http://127.0.0.1:18550", "--check-only") `
              -Wait `
              -PassThru
            if ($clientCheck.ExitCode -ne 0) {
              throw "Cliente desktop empacotado não conseguiu validar o servidor. ExitCode=$($clientCheck.ExitCode)"
            }
          }
          finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Smoke test upgrade over running server
        shell: pwsh
        run: |
          $installDir = Join-Path $env:ProgramFiles "ClimateTest Manager"
          $oldData = Join-Path $env:RUNNER_TEMP "ClimateTestManagerOldData"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          New-Item -ItemType Directory -Path $oldData -Force | Out-Null
          Copy-Item `
            ".\dist\ClimateTestManager-v0.7.0\ClimateTestServer.exe" `
            (Join-Path $installDir "ClimateTestServer.exe") `
            -Force

          $oldServer = Start-Process `
            -FilePath (Join-Path $installDir "ClimateTestServer.exe") `
            -ArgumentList @(
              "--host", "127.0.0.1",
              "--port", "18551",
              "--data-directory", "`"$oldData`""
            ) `
            -PassThru

          Start-Sleep -Seconds 4
          if ($oldServer.HasExited) {
            throw "Servidor usado para simular a versão antiga encerrou cedo demais."
          }

          $setup = Start-Process `
            -FilePath ".\dist\ClimateTestManager-Server-Setup-v0.7.0.exe" `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait `
            -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "Instalador falhou no teste de atualização. ExitCode=$($setup.ExitCode)"
          }

          if (Get-Process -Id $oldServer.Id -ErrorAction SilentlyContinue) {
            throw "O instalador não encerrou o servidor antigo antes de substituir o executável."
          }

          $ready = $false
          for ($attempt = 1; $attempt -le 45; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:8550/" `
                -UseBasicParsing `
                -TimeoutSec 2
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                $ready = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            throw "Servidor instalado não respondeu após o teste de atualização."
          }

          $installedClient = Join-Path $installDir "ClimateTestManager.exe"
          $clientCheck = Start-Process `
            -FilePath $installedClient `
            -ArgumentList @("--url", "http://127.0.0.1:8550", "--check-only") `
            -Wait `
            -PassThru
          if ($clientCheck.ExitCode -ne 0) {
            throw "Cliente desktop instalado não conseguiu alcançar o servidor central."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClimateTestManager-v0.7.0-Windows
          if-no-files-found: error
          path: |
            dist/ClimateTestManager-Server-Setup-v0.7.0.exe
            dist/ClimateTestManager-v0.7.0-windows.zip

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/release/v0.7.0' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = if ("${{ github.ref }}" -like "refs/tags/*") {
            "${{ github.ref_name }}"
          } else {
            "v0.7.0"
          }
          gh release create $releaseTag `
            "dist/ClimateTestManager-Server-Setup-v0.7.0.exe" `
            "dist/ClimateTestManager-v0.7.0-windows.zip" `
            --target "${{ github.sha }}" `
            --title "ClimateTest Manager $releaseTag" `
            --generate-notes
