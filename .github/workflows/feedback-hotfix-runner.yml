name: Run real-world feedback hotfix

on:
  push:
    branches:
      - feat/v0.8.0-production-polish

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply corrected patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/feedback-hotfix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"

          old_role = 'return "Administrador" if self.is_admin else "Operador"'
          new_role = 'return "Administrador" if self.role == "admin" else "Operador"'
          if old_role not in script:
              raise RuntimeError('role applicator marker not found')
          script = script.replace(old_role, new_role, 1)
          script = script.replace('onboarding_completed_at=None,', 'onboarding_completed=False,')
          script = script.replace('if count != 1:', 'if count < 1:')
          exec(compile(script, '<feedback-hotfix>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Polish generated code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'polish marker not found in {path}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          patch(
              'src/client.py',
              '''    except Exception:\n        try:\n            ctypes.windll.user32.SetProcessDPIAware()\n        except Exception:\n            pass\n''',
              '''    except Exception:\n        with suppress(Exception):\n            ctypes.windll.user32.SetProcessDPIAware()\n''',
          )
          patch(
              'src/climatetest_manager/services/background.py',
              '''            "O banco SQLite ativo não deve ficar no OneDrive. Use o OneDrive somente para as cópias de segurança."\n''',
              '''            "O banco SQLite ativo não deve ficar no OneDrive. "\n            "Use o OneDrive somente para as cópias de segurança."\n''',
          )
          patch(
              'src/climatetest_manager/services/background.py',
              '''            "A tarefa de notificações do Windows não foi encontrada. Execute novamente o instalador "\n            "do ClimateTest Manager e escolha Reparar/Atualizar; seus dados serão preservados."\n''',
              '''            "A tarefa de notificações do Windows não foi encontrada. "\n            "Execute novamente o instalador do ClimateTest Manager e escolha "\n            "Reparar/Atualizar; seus dados serão preservados."\n''',
          )
          patch(
              'src/climatetest_manager/ui/views/production_settings.py',
              '''                    content="Falha registrada. O administrador foi avisado e o e-mail será processado em segundo plano.",\n''',
              '''                    content=(\n                        "Falha registrada. O administrador foi avisado e o e-mail será "\n                        "processado em segundo plano."\n                    ),\n''',
          )
          patch(
              'src/climatetest_manager/ui/views/users.py',
              '''                        "Administradores gerenciam contas. Operadores executam todas as funções técnicas. "\n                        "O perfil Consulta acompanha ensaios e detalhes sem alterar a operação.",\n''',
              '''                        "Administradores gerenciam contas. Operadores executam todas as "\n                        "funções técnicas. O perfil Consulta acompanha ensaios e detalhes "\n                        "sem alterar a operação.",\n''',
          )
          PY
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format
        run: python -m ruff format src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml src tests
          git diff --cached --quiet && exit 0
          git commit -m 'fix: corrigir problemas encontrados no teste real da v0.8.0'
          git push origin HEAD:feat/v0.8.0-production-polish
