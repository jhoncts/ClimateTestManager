name: Format v0.8.6 schedule helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-source:
    if: github.head_ref == 'feat/v0.8.6-stability-cold-flow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.15.22

      - name: Format schedule source
        run: ruff format src/climatetest_manager/v086_schedule.py

      - name: Verify formatted source
        run: ruff format --check src/climatetest_manager/v086_schedule.py

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: v086-schedule-formatted
          retention-days: 1
          path: src/climatetest_manager/v086_schedule.py
