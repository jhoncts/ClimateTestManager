name: v0.8.6 fix conditioning imports

on:
  push:
    branches:
      - feat/v0.8.6-stability-cold-flow

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.8.6-stability-cold-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix imports and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/climatetest_manager/v086_conditioning.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from contextlib import suppress\n', '')
          text = text.replace('from datetime import datetime, timedelta\n', 'from datetime import datetime\n')
          path.write_text(text, encoding='utf-8')
          PY
          pip install ruff==0.15.22
          ruff format src/climatetest_manager/v086_conditioning.py
          ruff check .
          ruff format --check .
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/climatetest_manager/v086_conditioning.py
          git commit -m "chore: corrige imports do acondicionamento v0.8.6"
          git push origin HEAD:feat/v0.8.6-stability-cold-flow
