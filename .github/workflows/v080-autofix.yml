name: v0.8.0 temporary autofix

on:
  push:
    branches:
      - "feat/v0.8.0-production-polish"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.8.0-production-polish
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.15.22
      - name: Apply safe fixes and formatting
        run: |
          ruff check --fix . || true
          ruff format .
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: aplicar formatação automática da v0.8.0"
          git push origin HEAD:feat/v0.8.0-production-polish
